[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proofs"
version = "0.2.0"
description = "A distributed system for constructing proofs to conjectures, coordinated through git."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = ["requests", "rich", "orjson"]

[project.optional-dependencies]
# Faster, finer ancestry sketches for --strategy breadth (core/citations.py).
fast = ["numpy"]
# proofs export --format png (export/png.py).
png = ["matplotlib"]

[project.scripts]
proofs = "proofs.cli.main:main"

[tool.setuptools.packages.find]
include = ["proofs*"]

# The default agent prompts, installed beside the code (workspace.agents_dir),
# and the HTML export's page and the KaTeX it inlines (export/html.py).
[tool.setuptools.package-data]
proofs = ["agents/*.md", "agents/parallel/*.md", "export/page/*",
          "export/vendor/katex/*", "export/vendor/katex/fonts/*"]
